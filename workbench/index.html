  'triangle-alert':'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>',

};
// 把所有 <i data-lucide="..."> 替换为对应的 inline SVG，不依赖 window.lucide
function __installLucideIcons(){
  document.querySelectorAll('i[data-lucide]').forEach(i=>{
    const key = i.dataset.lucide;
    if (_LUCIDE_FALLBACK[key]){
      const wrapper = document.createElement('span');
      wrapper.innerHTML = _LUCIDE_FALLBACK[key];
      const svg = wrapper.firstElementChild;
      svg.setAttribute('class', i.getAttribute('class')||'');
      if (i.style.cssText) svg.setAttribute('style', i.style.cssText);
      i.replaceWith(svg);
    } else if (window.lucide && typeof window.lucide.createIcons === 'function'){
      // 真 Lucide CDN 加载成功时，让它接管
      try { window.lucide.createIcons(); } catch(e){}
    }
  });
}
window.addEventListener('load', __installLucideIcons);

<script>
// 纸美学设计 token：将原 blue/violet 语义色重映射为墨绿 forest / 朱砂 clay，
// 这样 render 函数里已有的 bg-blue / text-violet / accent-blue 等类无需改动即自动换肤。
tailwind.config = {
  theme: {
    extend: {
      colors: {
        paper: '#F4EFE3', paper2: '#FAF6EC', card: '#FFFDF7',
        ink: '#1A2A24', ink2: '#42534B', muted: '#6E7E76', faint: '#95A199',
        line: '#E4DAC7', line2: '#D6C9B0',
        // 主色：墨绿
        blue: '#0E4C42', bluesoft: '#E8F1EC', blue2: '#14695B',
        forest: '#0E4C42', forest2: '#14695B',
        // 辅色：朱砂
        violet: '#C2492A', violetsoft: '#FBEBE3', violet2: '#E0673F',
        clay: '#C2492A', clay2: '#E0673F',
        // 点缀：金
        gold: '#A9822C',
        ok: '#1C7A58', warn: '#A9822C', danger: '#B23A2C',
      },
      fontFamily: {
        display: ['"Noto Serif SC"', '"Songti SC"', '"Source Han Serif SC"', 'SimSun', 'serif'],
        sans: ['"PingFang SC"', '"HarmonyOS Sans SC"', '"Microsoft YaHei"', 'system-ui', 'sans-serif'],
        mono: ['"IBM Plex Mono"', 'SFMono-Regular', 'Consolas', 'monospace'],
      },
      borderRadius: { xl2: '14px' },
      boxShadow: { card: '0 2px 4px rgba(26,42,36,.04), 0 18px 40px -24px rgba(26,42,36,.34)' },
    }
  }
}
</script>
<style>
/* =========================================================
   纸美学设计系统（迁移自 demo/styles.css）
   主色：墨绿 forest / 朱砂 clay / 米纸 paper
   ========================================================= */
:root{
  --paper:#F4EFE3; --paper-2:#FAF6EC; --card:#FFFDF7; --card-2:#FBF7EE;
  --ink:#1A2A24; --ink-2:#42534B; --muted:#6E7E76; --faint:#95A199;
  --line:#E4DAC7; --line-2:#D6C9B0;
  --forest:#0E4C42; --forest-2:#14695B; --forest-soft:#E8F1EC;
  --clay:#C2492A; --clay-2:#E0673F; --clay-soft:#FBEBE3;
  --gold:#A9822C; --gold-soft:#F8EFD8;
  --ok:#1C7A58; --ok-soft:#E7F4ED; --danger:#B23A2C; --danger-soft:#FBEAE6;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --shadow-sm:0 1px 0 rgba(26,42,36,.04), 0 1px 3px rgba(26,42,36,.05);
  --shadow-md:0 2px 4px rgba(26,42,36,.04), 0 18px 40px -24px rgba(26,42,36,.34);
  --shadow-lg:0 4px 10px rgba(26,42,36,.05), 0 36px 70px -40px rgba(26,42,36,.45);
  --serif:"Noto Serif SC","Songti SC","STSong","Source Han Serif SC","SimSun",serif;
  --sans:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono","SFMono-Regular","JetBrains Mono",Consolas,monospace;
}
*{box-sizing:border-box; -webkit-font-smoothing:antialiased;}
html{scroll-behavior:smooth;}
body{
  margin:0; min-height:100vh;
  background:
    radial-gradient(1100px 620px at 88% -12%, rgba(14,76,66,.10), transparent 62%),
    radial-gradient(900px 520px at -8% 8%, rgba(194,73,42,.08), transparent 60%),
    linear-gradient(180deg, #F7F2E7 0%, var(--paper) 42%, #F1EBDD 100%);
  color:var(--ink); font-family:var(--sans); font-size:14.5px; line-height:1.65;
}
.bg-grid{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:
    linear-gradient(rgba(14,76,66,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(14,76,66,.05) 1px, transparent 1px);
  background-size:34px 34px;
  -webkit-mask-image:linear-gradient(180deg, #000 0%, rgba(0,0,0,.55) 38%, transparent 78%);
          mask-image:linear-gradient(180deg, #000 0%, rgba(0,0,0,.55) 38%, transparent 78%);
}
::selection{background:rgba(20,105,91,.18);}
a{color:var(--forest);}
button{font-family:inherit;}

/* ---------------- 顶栏 ---------------- */
.topbar{
  position:sticky; top:0; z-index:60;
  display:flex; align-items:center; gap:18px; height:72px; padding:0 26px;
  background:rgba(250,246,236,.86); backdrop-filter:blur(14px) saturate(1.2);
  -webkit-backdrop-filter:blur(14px) saturate(1.2); border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:center; gap:12px; text-decoration:none; color:inherit; flex:0 0 auto;}
.seal{
  width:42px; height:42px; display:grid; place-items:center;
  background:linear-gradient(150deg, var(--forest-2), var(--forest) 70%);
  color:#F6F1E4; font-family:var(--serif); font-size:24px; font-weight:700;
  border-radius:11px; line-height:1;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28), 0 8px 18px -10px rgba(14,76,66,.9);
}
.brand-text{display:flex; flex-direction:column; line-height:1.2;}
.brand-text strong{font-family:var(--serif); font-size:22px; letter-spacing:.14em;}
.brand-text span{font-size:11px; color:var(--muted); letter-spacing:.16em;}
.top-center{flex:1 1 auto; min-width:0; display:flex; justify-content:center; gap:10px; align-items:center;}
.top-actions{display:flex; align-items:center; gap:9px; flex:0 0 auto;}

.status-chip{
  display:inline-flex; align-items:center; gap:7px; padding:6px 13px; border-radius:999px;
  font-size:12.5px; font-weight:600; border:1px solid var(--line-2); background:var(--card);
  color:var(--ink-2); letter-spacing:.02em; white-space:nowrap; font-family:var(--mono);
}
.status-chip .pip{width:7px; height:7px; border-radius:50%; background:var(--faint);}
.status-chip.is-running{background:var(--gold-soft); border-color:#E8D6A9; color:#7A5B12;}
.status-chip.is-running .pip{background:var(--gold); animation:chipPulse 1.1s infinite;}
.status-chip.is-verified{background:var(--forest-soft); border-color:#C4DCD3; color:var(--forest);}
.status-chip.is-verified .pip{background:var(--forest-2);}
@keyframes chipPulse{0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.35; transform:scale(.75);}}

/* ---------------- 按钮 ---------------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  padding:9px 15px; border-radius:10px; font-size:13px; font-weight:600;
  border:1px solid var(--line-2); background:var(--card); color:var(--ink-2);
  cursor:pointer; transition:transform .16s ease, box-shadow .16s, background .16s, border-color .16s, color .16s; white-space:nowrap;
}
.btn:hover{transform:translateY(-1px); box-shadow:var(--shadow-sm); border-color:var(--faint); color:var(--ink);}
.btn:active{transform:translateY(0);}
.btn:disabled{opacity:.42; cursor:not-allowed; transform:none; box-shadow:none;}
.btn-primary{background:linear-gradient(160deg, var(--forest-2), var(--forest) 72%); border-color:var(--forest); color:#FBF7EA; box-shadow:0 10px 22px -14px rgba(14,76,66,.95), inset 0 1px 0 rgba(255,255,255,.18);}
.btn-primary:hover{color:#fff; border-color:var(--forest-2); background:linear-gradient(160deg, #17806F, var(--forest));}
.btn-clay{background:linear-gradient(160deg, var(--clay-2), var(--clay) 74%); border-color:#A93E22; color:#FFF6ED; box-shadow:0 10px 22px -14px rgba(194,73,42,.9), inset 0 1px 0 rgba(255,255,255,.2);}
.btn-clay:hover{color:#fff; border-color:#B84A2B;}
.btn-sm{padding:6px 11px; font-size:12px; border-radius:8px;}

/* ---------------- 卡片 ---------------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow-sm); position:relative;}
.card-pad{padding:18px 18px 20px;}
.card-title{display:flex; align-items:center; gap:9px; font-family:var(--serif); font-size:16.5px; font-weight:700; letter-spacing:.02em; margin:0 0 4px;}
.card-sub{font-size:12.5px; color:var(--muted); margin:0 0 14px;}

/* ---------------- 配置 ---------------- */
.form-block{margin-bottom:15px;}
.form-block:last-child{margin-bottom:0;}
.seg-group{display:flex; gap:6px; flex-wrap:wrap;}
.seg-opt{
  flex:1 1 0; min-width:64px; text-align:center; padding:8px 6px;
  border:1px solid var(--line); background:var(--paper-2); border-radius:9px;
  font-size:12.5px; font-weight:600; color:var(--ink-2); cursor:pointer; transition:all .15s ease; user-select:none;
}
.seg-opt:hover{border-color:var(--line-2); background:#fff;}
.seg-opt.active{background:var(--forest); border-color:var(--forest); color:#FBF7EA; box-shadow:0 8px 16px -12px rgba(14,76,66,.9);}
/* 多选标签（班级学情等） */
.opt-chip{
  display:inline-flex; align-items:center; gap:5px; padding:6px 12px;
  border:1px solid var(--line); background:var(--paper-2); color:var(--ink-2);
  border-radius:999px; font-size:12px; font-weight:500; cursor:pointer;
  transition:all .15s ease; user-select:none; line-height:1.5;
}
.opt-chip:hover{border-color:var(--line-2); background:#fff; color:var(--ink);}
.opt-chip.on{background:var(--forest); border-color:var(--forest); color:#FBF7EA; box-shadow:0 6px 14px -10px rgba(14,76,66,.8);}
.opt-chip .ck{width:11px; display:inline-block; visibility:hidden; font-size:10px;}
.opt-chip.on .ck{visibility:visible;}
select.cfg-input, input.cfg-input, textarea.cfg-input{
  width:100%; font-family:inherit; font-size:13.5px; color:var(--ink);
  background:var(--paper-2); border:1px solid var(--line); border-radius:9px;
  padding:9px 11px; outline:none; transition:border-color .15s, box-shadow .15s, background .15s;
}
.cfg-input:focus{border-color:var(--forest-2); background:#fff; box-shadow:0 0 0 3px rgba(20,105,91,.10);}

/* ---------------- 页签 ---------------- */
.tabs{display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:20px; overflow-x:auto; scrollbar-width:none; position:relative;}
.tabs::-webkit-scrollbar{display:none;}
.tab{appearance:none; border:0; background:transparent; cursor:pointer; padding:11px 15px 13px; font-size:13.5px; font-weight:600; color:var(--muted); position:relative; white-space:nowrap; transition:color .18s; letter-spacing:.02em;}
.tab:hover{color:var(--ink-2);}
.tab.active{color:var(--forest);}
.tab.active::after{content:""; position:absolute; left:12px; right:12px; bottom:-1px; height:2.5px; background:var(--forest); border-radius:2px 2px 0 0; animation:tabIn .25s ease;}
@keyframes tabIn{from{transform:scaleX(.4); opacity:.4;} to{transform:scaleX(1); opacity:1;}}

/* ---------------- chips / 标签 ---------------- */
.chip{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:500; padding:2.5px 8px; border-radius:6px; border:1px solid var(--line); background:var(--paper-2); color:var(--ink-2); line-height:1.5;}
.chip.kp{background:#F1F4EF; border-color:#DCE4DA;}
.chip.obj{background:var(--forest-soft); border-color:#CFE2DA; color:var(--forest);}
.chip.warn{background:var(--gold-soft); border-color:#EAD9B3; color:#7E5F16;}
.code-tag{font-family:var(--mono); font-size:10px; font-weight:600; letter-spacing:.06em; background:var(--paper-2); border:1px solid var(--line); color:var(--ink-2); padding:1px 6px; border-radius:5px;}
.code-tag.forest{background:var(--forest-soft); border-color:#CFE2DA; color:var(--forest);}
.code-tag.clay{background:var(--clay-soft); border-color:#F0D0C2; color:var(--clay);}

/* ---------------- 通用块 / 表格 ---------------- */
.blk{background:var(--card); border:1px solid var(--line); border-radius:var(--r-md); padding:17px 18px; box-shadow:var(--shadow-sm); position:relative; transition:box-shadow .2s ease, border-color .2s ease;}
.blk:hover{box-shadow:var(--shadow-md); border-color:var(--line-2);}
.rubric{width:100%; border-collapse:separate; border-spacing:0; font-size:12px;}
.rubric th,.rubric td{border-bottom:1px solid var(--line); padding:9px 11px; text-align:left; vertical-align:top; line-height:1.65;}
.rubric th{font-weight:600; color:var(--muted); font-size:11px; letter-spacing:.04em; background:var(--paper-2);}
.rubric tr:last-child td{border-bottom:0;}

/* ---------------- Toast ---------------- */
.toast{background:#123F37; color:#EAF3EE; border:1px solid rgba(255,255,255,.14); padding:11px 16px; border-radius:10px; font-size:12.5px; box-shadow:0 20px 40px -20px rgba(0,0,0,.6); display:flex; align-items:center; gap:9px; max-width:340px; animation:toastIn .3s cubic-bezier(.2,.9,.3,1.2);}
.toast .tp{width:7px; height:7px; border-radius:50%; background:#8FD3C0; flex:0 0 auto;}
.toast.warn{background:#4A3510; border-color:rgba(255,255,255,.12);}
.toast.warn .tp{background:#E8C063;}
.toast.err{background:#4B1F17;}
.toast.err .tp{background:#E8998A;}
@keyframes toastIn{from{transform:translateY(10px); opacity:0;} to{transform:none; opacity:1;}}

/* ---------------- 动画 / 空状态 ---------------- */
.empty{border:1.5px dashed var(--line-2); border-radius:var(--r-md); padding:26px 20px; text-align:center; font-size:12.5px; color:var(--muted); background:rgba(255,255,255,.35); line-height:1.7;}
.rise{animation:rise .45s cubic-bezier(.2,.8,.2,1) both;}
@keyframes rise{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;}}
.fade-in{animation:fade .3s ease;}
@keyframes fade{from{opacity:0} to{opacity:1}}
::-webkit-scrollbar{width:9px; height:9px;}
::-webkit-scrollbar-thumb{background:var(--line-2); border-radius:99px; border:2px solid transparent; background-clip:padding-box;}
::-webkit-scrollbar-track{background:transparent;}

/* =========================================================
   workbench 兼容层：保留原有 class 名，映射到纸美学
   （render 函数中的 Tailwind 颜色类已通过 config 重映射）
   ========================================================= */
.font-display{ font-family:var(--serif); }
.mono{ font-family:var(--mono); }
.hair{ box-shadow: inset 0 0 0 .5px var(--line); }
.hair-b{ box-shadow: inset 0 -0.5px 0 0 var(--line); }
.hair-t{ box-shadow: inset 0 0.5px 0 0 var(--line); }
/* 蓝图网格 → 纸纹墨绿网格 */
.blueprint{background-color:var(--paper-2); background-image:linear-gradient(rgba(14,76,66,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(14,76,66,.045) 1px, transparent 1px); background-size:28px 28px;}
.card-hover{ transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease; }
.card-hover:hover{ transform: translateY(-1px); box-shadow: var(--shadow-md); border-color: var(--line-2); }
/* 课型卡片：纸卡 + 选中墨绿软底与左侧竖条 */
.type-card{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  box-shadow:var(--shadow-sm); position:relative; overflow:hidden;
  transition:transform .18s ease, box-shadow .18s, border-color .18s, background .18s;
}
.type-card:hover{ transform:translateY(-1px); box-shadow:var(--shadow-md); border-color:var(--line-2); }
.type-card::before{
  content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
  background:linear-gradient(180deg, var(--forest-2), var(--forest));
  transform:scaleY(0); transform-origin:top; transition:transform .22s ease;
}
.type-card.is-active{ background:var(--forest-soft); border-color:#CFE2DA; }
.type-card.is-active::before{ transform:scaleY(1); }
/* 分步向导 */
.step-dot{
  width:26px; height:26px; flex:0 0 26px; border-radius:50%; display:grid; place-items:center;
  font-size:12px; font-weight:700; font-family:var(--font-mono);
  border:1.5px solid var(--line-2); color:var(--muted); background:var(--card); transition:all .18s;
}
.step-dot.done{ background:var(--forest); border-color:var(--forest); color:#FBF7EA; }
.step-dot.cur{ border-color:var(--forest); color:var(--forest); background:var(--forest-soft); box-shadow:0 0 0 3px rgba(14,76,66,.10); }
.step-item{ width:100%; display:flex; gap:11px; align-items:flex-start; padding:9px 8px; border-radius:11px; text-align:left; transition:background .16s; }
.step-item:hover{ background:var(--paper-2); }
.step-item.cur{ background:var(--forest-soft); }
.step-item.locked{ opacity:.4; cursor:not-allowed; }
.mode-card{
  width:100%; text-align:left; padding:13px 14px; border:1px solid var(--line); border-radius:13px;
  background:var(--paper-2); transition:all .16s; position:relative;
}
.mode-card:hover{ border-color:var(--line-2); background:#fff; }
.mode-card.is-active{ background:var(--forest-soft); border-color:#CFE2DA; box-shadow:0 6px 18px -16px rgba(14,76,66,.7); }
/* —— 知识库检索增强 —— */
.kb-search-bar{ display:flex; gap:10px; align-items:center; }
.kb-search-wrap{ position:relative; flex:1; min-width:0; }
.kb-search-wrap::before{
  content:''; position:absolute; left:11px; top:50%; transform:translateY(-50%);
  width:14px; height:14px; opacity:.55; pointer-events:none; z-index:1;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%236E7E76' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='8'/><path d='m21 21-4.3-4.3'/></svg>");
}
/* 统一让所有 kb-search-wrap 内 input 都给搜索图标 + clear 按钮留位 */
.kb-search-wrap input{ padding-left:34px; padding-right:30px; }
.kb-clear{
  position:absolute; right:6px; top:50%; transform:translateY(-50%);
  width:18px; height:18px; border-radius:50%; border:none;
  background:var(--line-2); color:var(--ink-2); font-size:10px; font-weight:700;
  cursor:pointer; display:none; align-items:center; justify-content:center;
  transition:all .12s; z-index:2; line-height:1;
}
.kb-clear:hover{ background:var(--danger); color:#fff; }
.kb-clear.show{ display:flex; }

.kb-result-meta{
  display:flex; align-items:center; gap:10px; padding:8px 2px 6px;
  font-size:11px; color:var(--muted); font-family:var(--mono); flex-wrap:wrap;
}
.kb-result-meta .kb-count{ color:var(--forest); font-weight:600; }
.kb-filter-chip{
  font-size:10px; padding:2px 8px; border-radius:999px;
  border:1px solid var(--line-2); background:var(--paper-2); color:var(--ink-2);
  cursor:pointer; font-family:var(--mono); letter-spacing:.02s; transition:all .12s;
}
.kb-filter-chip:hover{ border-color:var(--line-2); background:#fff; }
.kb-filter-chip.on{ background:var(--forest); border-color:var(--forest); color:#FBF7EA; }

/* 结果卡片 */
.kb-hit{
  padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--card);
  transition:border-color .16s, box-shadow .16s, transform .16s;
  position:relative; overflow:hidden;
}
.kb-hit:hover{ border-color:var(--line-2); box-shadow:var(--shadow-sm); transform:translateY(-1px); }
.kb-hit.is-selected{ border-color:var(--forest); box-shadow:0 0 0 3px rgba(14,76,66,.10); }
.kb-hit .kb-hd{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:7px;
}
.kb-hit .kb-tag{
  font-size:10px; font-weight:600; padding:2px 8px; border-radius:999px;
  letter-spacing:.04em; font-family:var(--mono);
}
.kb-tag.cat-课标{ background:#E8F1EC; color:#0E4C42; border:1px solid #C4DCD3; }
.kb-tag.cat-题库{ background:#FBF7EA; color:#7A5B12; border:1px solid #E8D6A9; }
.kb-tag.cat-德育{ background:#FBEBE3; color:#A83D1F; border:1px solid #E0B9A8; }
.kb-tag.cat-知识库{ background:#F1EEF7; color:#3D3456; border:1px solid #D5CEE0; }
.kb-tag.cat-其他{ background:#F0EFEB; color:#555; border:1px solid #D8D4CA; }
.kb-hit .kb-src{
  font-family:var(--mono); font-size:10.5px; color:var(--muted);
  flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.kb-hit .kb-score-wrap{ display:flex; align-items:center; gap:6px; font-family:var(--mono); font-size:10px; color:var(--faint); }
.kb-hit .kb-score-bar{ width:40px; height:4px; background:var(--line); border-radius:3px; overflow:hidden; }
.kb-hit .kb-score-bar > span{
  display:block; height:100%; border-radius:3px;
  background:var(--forest); transition:width .4s ease;
}
.kb-hit .kb-score-num{ font-variant-numeric:tabular-nums; min-width:32px; text-align:right; }
.kb-hit .kb-body{
  font-size:12.5px; color:var(--ink-2); line-height:1.65;
  display:-webkit-box; -webkit-box-orient:vertical; overflow:hidden; -webkit-line-clamp:2;
}
.kb-hit.is-open .kb-body{ display:block; -webkit-line-clamp:unset; max-height:none; }
.kb-hit .kb-body mark{
  background:#FFF3B0; color:var(--ink); padding:1px 2px; border-radius:2px; font-weight:500;
  box-shadow:0 1px 0 rgba(255,243,176,.6);
}
.kb-hit .kb-ft{
  display:flex; align-items:center; gap:10px; margin-top:8px; padding-top:7px;
  border-top:0.5px dashed var(--line);
}
.kb-hit .kb-ft button{
  font-size:11px; color:var(--forest); background:none; border:none; cursor:pointer; padding:0;
  font-family:inherit; transition:color .12s; display:inline-flex; align-items:center; gap:2px;
}
.kb-hit .kb-ft button:hover{ color:var(--forest-2); text-decoration:underline; }
.kb-hit .kb-open-src{
  font-size:11px; color:var(--clay); text-decoration:none; display:inline-flex; align-items:center; gap:2px;
  transition:color .12s; padding:0 6px; border-left:1px dashed var(--line-2);
}
.kb-hit .kb-open-src:hover{ color:var(--clay-2); text-decoration:underline; }
.kb-hit .kb-ft .kb-ft-spacer{ flex:1; }
.kb-hit .kb-tier{
  font-family:var(--mono); font-size:9.5px; padding:1px 6px; border-radius:4px; letter-spacing:.02em;
}
.kb-tier.tier-main{ background:var(--forest-soft); color:var(--forest); }
.kb-tier.tier-supplement{ background:var(--clay-soft); color:var(--clay); }

/* 空状态 / 推荐关键词 */
.kb-empty{
  padding:22px 20px; border-radius:12px; border:1px dashed var(--line-2);
  background:var(--paper-2); text-align:center;
}
.kb-empty .kb-empty-icon{ font-size:26px; margin-bottom:8px; opacity:.6; }
.kb-empty .kb-empty-title{ font-size:13px; color:var(--ink-2); font-weight:600; margin-bottom:4px; }
.kb-empty .kb-empty-desc{ font-size:11.5px; color:var(--muted); line-height:1.6; margin-bottom:14px; }
.kb-empty .kb-suggest-label{
  font-size:10px; color:var(--faint); font-family:var(--mono); letter-spacing:.12em;
  text-transform:uppercase; margin-bottom:8px;
}
.kb-suggest-row{ display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
.kb-suggest-chip{
  display:inline-flex; align-items:center; gap:4px; padding:4px 11px;
  border:1px solid var(--line-2); background:#fff; border-radius:999px;
  font-size:11.5px; color:var(--ink-2); cursor:pointer; transition:all .12s;
}
.kb-suggest-chip:hover{ border-color:var(--forest-2); background:var(--forest-soft); color:var(--forest); }
.kb-suggest-chip .kb-sug-ic{ font-size:10px; opacity:.5; }

.kb-loading{ display:flex; flex-direction:column; gap:10px; }
.kb-loading .kb-hit{ padding:12px 14px; }
.kb-loading .skeleton{ margin-bottom:6px; }

/* 分步导航（历史样式，保留兼容） */
.src-subnav{ display:flex; gap:6px; margin-bottom:18px; padding-bottom:14px; border-bottom:1px dashed var(--line); }
.src-subnav .src-sub{
  flex:1; display:flex; align-items:center; gap:8px; padding:9px 12px;
  border:1px solid var(--line); border-radius:11px; background:var(--paper-2);
  font-size:12px; font-weight:500; color:var(--ink-2); cursor:pointer;
  transition:all .15s; text-align:left; position:relative;
}
.src-subnav .src-sub:hover:not(.locked){ border-color:var(--line-2); background:#fff; }
.src-subnav .src-sub.cur{ background:var(--forest-soft); border-color:#CFE2DA; color:var(--forest); font-weight:600; }
.src-subnav .src-sub.done{ background:#E7F4ED; border-color:#C4DCD3; color:var(--ok); }
.src-subnav .src-sub.locked{ opacity:.35; cursor:not-allowed; }
.src-subnav .src-sub .sub-num{
  width:20px; height:20px; display:grid; place-items:center; border-radius:50%;
  background:var(--line-2); color:var(--ink-2); font-size:10px; font-weight:700; font-family:var(--mono); flex-shrink:0;
}
.src-subnav .src-sub.cur .sub-num{ background:var(--forest); color:#FBF7EA; }
.src-subnav .src-sub.done .sub-num{ background:var(--ok); color:#fff; }
.src-subnav .src-sub.locked .sub-num{ background:var(--line); color:var(--faint); }
.src-subnav .src-sub .sub-lbl{ flex:1; line-height:1.35; }
.src-subnav .src-sub .sub-lbl span.xxs{ display:block; font-size:10px; color:var(--muted); font-weight:400; margin-top:1px; }

/* 子步状态反馈条 */
.src-feedback{
  display:flex; align-items:center; gap:10px; padding:11px 14px; border-radius:11px;
  margin-bottom:14px; font-size:12px; line-height:1.55;
}
.src-feedback.is-hint{ background:var(--forest-soft); border:1px solid #CFE2DA; color:var(--forest); }
.src-feedback.is-done{ background:#E7F4ED; border:1px solid #C4DCD3; color:var(--ok); }
.src-feedback.is-skip{ background:var(--paper-2); border:1px dashed var(--line-2); color:var(--muted); }
.src-feedback .fb-ic{ font-size:14px; flex-shrink:0; }
.src-feedback .fb-btn{
  margin-left:auto; font-size:11px; padding:4px 10px; border-radius:6px; border:1px solid var(--line-2);
  background:#fff; color:var(--ink-2); cursor:pointer; transition:all .12s; flex-shrink:0;
}
.src-feedback .fb-btn:hover{ border-color:var(--forest-2); color:var(--forest); }

/* 课标列表（搜索过滤后） */
.std-filter-bar{ display:flex; gap:8px; margin-bottom:12px; }
.std-filter-bar input{ flex:1; padding-left:34px; }
.std-list{ max-height:340px; overflow-y:auto; border:1px solid var(--line); border-radius:11px; background:var(--paper-2); }
.std-list label{
  display:flex; align-items:flex-start; gap:10px; padding:10px 12px; cursor:pointer;
  border-bottom:0.5px solid var(--line); transition:background .12s;
}
.std-list label:last-child{ border-bottom:none; }
.std-list label:hover{ background:#fff; }
.std-list input[type="checkbox"]{ margin-top:2px; accent-color:var(--forest); }
.std-list .std-code{ font-family:var(--mono); font-size:10px; color:var(--forest); background:var(--forest-soft); padding:1px 6px; border-radius:4px; flex-shrink:0; }
.std-list .std-pdf-tag{ font-family:var(--mono); font-size:10px; color:var(--clay); background:var(--clay-soft); padding:1px 6px; border-radius:4px; flex-shrink:0; margin-right:6px; }
.std-list .std-text{ font-size:12.5px; color:var(--ink-2); flex:1; line-height:1.5; }
.std-list .std-kps{ font-size:10px; color:var(--muted); margin-top:3px; }
.std-list .empty-tip{ padding:20px; text-align:center; color:var(--muted); font-size:12px; }

/* 资料类型筛选（检索环节） */
.kb-type-bar{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
.kb-type-chip{
  display:inline-flex; align-items:center; gap:5px; padding:5px 12px; border-radius:999px;
  border:1px solid var(--line-2); background:#fff; font-size:11.5px; color:var(--ink-2);
  cursor:pointer; transition:all .12s; font-weight:500;
}
.kb-type-chip:hover{ border-color:var(--forest-2); color:var(--forest); }
.kb-type-chip.on{ background:var(--forest); border-color:var(--forest); color:#FBF7EA; }

/* —— 备课两栏布局（完全复用组卷页 blueprint / empty-seal / outline-card）—— */
.prep-layout{
  display:flex; gap:5px; height:calc(100vh - 72px - 40px); min-height:560px;
}
.prep-aside{ width:380px; min-width:360px; flex-shrink:0; }
.prep-aside-inner{ height:100%; display:flex; flex-direction:column; overflow:hidden; }
.prep-right{ flex:1; min-width:0; }
/* 响应式：窄屏退化成单栏 */
@media (max-width: 720px){
  .prep-layout{ flex-direction:column; height:auto; }
  .prep-aside{ width:100%; min-width:0; }
  .prep-aside-inner{ max-height:none; height:auto; }
  .prep-right{ min-height:320px; }
}

/* 子块 A/B/C 编号徽章 */
.step-sub{
  width:22px; height:22px; display:grid; place-items:center;
  background:var(--forest); color:#FBF7EA; border-radius:7px;
  font-family:var(--mono); font-weight:700; font-size:11px; letter-spacing:.02em;
  box-shadow:0 2px 6px -2px rgba(14,76,66,.45);
  flex-shrink:0;
}
.kb-type-chip .tc-emoji{ font-size:12px; }

/* 结果卡片中「类型」标签 */
.kb-hit .kb-type-tag{
  font-size:9.5px; font-family:var(--mono); padding:1px 6px; border-radius:4px;
  background:#FBF7EA; color:#7A5B12; border:1px solid #E8D6A9;
}

/* 子步完成按钮区 */
.src-actions{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  margin-top:18px; padding-top:14px; border-top:0.5px dashed var(--line);
}
.src-actions .src-actions-left{ font-size:11.5px; color:var(--muted); }
.src-actions .src-actions-left b{ color:var(--ink-2); font-weight:600; }
.src-actions button{ flex-shrink:0; }
.preview-row{ display:grid; grid-template-columns:88px 1fr auto; gap:10px; align-items:baseline; padding:10px 0; border-bottom:0.5px dashed var(--line); }
.preview-row:last-child{ border-bottom:none; }
.preview-k{ font-size:11.5px; color:var(--muted); }
.preview-v{ font-size:13px; color:var(--ink); line-height:1.6; }
.skeleton{ background: linear-gradient(90deg, var(--paper-2) 25%, var(--card) 50%, var(--paper-2) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius:6px; }
@keyframes shimmer{ 0%{background-position:200% 0} 100%{background-position:-200% 0} }
/* 脉冲点 → 金色脉冲（与 demo 运行态一致） */
.pulse-dot{ width:8px; height:8px; border-radius:50%; background:var(--gold); box-shadow:0 0 0 0 rgba(169,130,44,.5); animation: wbPulse 1.6s infinite; }
@keyframes wbPulse{ 0%{box-shadow:0 0 0 0 rgba(169,130,44,.5)} 70%{box-shadow:0 0 0 8px rgba(169,130,44,0)} 100%{box-shadow:0 0 0 0 rgba(169,130,44,0)} }

/* Lucide 图标：纸美学 stroke 风格统一 */
.ic{ width:16px; height:16px; stroke-width:1.8; stroke:currentColor; flex-shrink:0; display:inline-block; vertical-align:-2px; }
.ic-lg{ width:20px; height:20px; stroke-width:1.6; }
.ic-xl{ width:24px; height:24px; stroke-width:1.4; }
.ic-sm{ width:12px; height:12px; stroke-width:2.0; }
.ic-forest{ stroke:var(--forest); color:var(--forest); }
.ic-clay{ stroke:var(--clay); color:var(--clay); }
.ic-muted{ stroke:var(--muted); color:var(--muted); }

// 轻提示
function toast(msg, type='info'){
  const el = document.createElement('div');

function nowTime(){ const d=new Date(); return d.toTimeString().slice(0,8); }
function setByPath(obj, path, val){
  const parts = path.split('.'); let o = obj;
  for (let i=0;i<parts.length-1;i++){ const k = parts[i]; if (o[k]==null) o[k] = /^\d+$/.test(parts[i+1])?[]:{}; o = o[k]; }
  o[parts[parts.length-1]] = val;
}
function getByPath(obj, path){ return path.split('.').reduce((a,k)=>a&&a[k], obj); }

/* =========================================================

========================================================= */
const _origFetch = window.fetch.bind(window);
window.fetch = async function(...args){
  const resp = await _origFetch(...args);
  if (resp.status === 401 && typeof args[0] === 'string' && args[0].startsWith('/api/')) {
    // 登录/me/logout 本身 401 是正常情况，不重定向
    if (!args[0].includes('/api/login') && !args[0].includes('/api/logout') && !args[0].includes('/api/me')) {
      setTimeout(() => { location.href = '/login.html'; }, 300);
    }
  }
  return resp;
};

========================================================= */
async function authCheck(){
  try{
    const r = await fetch('/api/me', { credentials:'same-origin' });
    if (!r.ok) { location.href = '/login.html'; return false; }
    const j = await r.json();
    if (!j.ok || !j.user) { location.href = '/login.html'; return false; }
    state.user = j.user;
    // 顶栏显示用户
    $('#userChip').style.display = 'flex';
    $('#userAvatar').textContent = j.user.name.charAt(0);
    $('#userName').textContent = j.user.name;
    $('#logoutBtn').onclick = logout;
    return true;
  } catch(e){
    location.href = '/login.html';
    return false;
  }
}
async function logout(){
  try { await fetch('/api/logout', { method:'POST', credentials:'same-origin' }); } catch {}
  location.href = '/login.html';
}

async function probe(){
  const ok = await authCheck();
  if (!ok) return;
  try{
    const ctrl = new AbortController();
    const t = setTimeout(()=>ctrl.abort(), 2500);
    const r = await fetch('/api/health', {signal:ctrl.signal});
    clearTimeout(t);
    const b = await r.json();
    state.backend = !!b.ok; state.mode = b.mode || 'demo'; state.model = b.model; state.embed = !!b.embedEnabled;
  }catch(e){ state.backend=false; state.mode='demo'; state.model=null; }
  if (state.backend){ refreshLibrary(); }
  render();
}

/* =========================================================
   渲染总入口
========================================================= */
function render(){
  renderTop();
  const app = $('#app');
  if (state.view==='prep') app.innerHTML = renderPrep();
  else if (state.view==='paper') app.innerHTML = renderPaper();
  else app.innerHTML = renderLibrary();
  // 优先用我们的 fallback 替换 <i data-lucide="...">（不依赖 CDN）；
  // 若 CDN 加载成功，它会先于 window.load 执行 createIcons，但我们的 fallback 再次调用是幂等的。
  if (typeof window.__installLucideIcons === 'function'){
    try { window.__installLucideIcons(); } catch(e) {}
  } else if (window.lucide && typeof window.lucide.createIcons === 'function'){
    try { window.lucide.createIcons(); } catch(e) {}
  }
}
function renderTop(){
  const nav = $('#topNav');
  const items = [{k:'prep',l:'智能备课'},{k:'paper',l:'智能组卷'},{k:'library',l:'资料库'}];
  nav.innerHTML = items.map(it=>`
    <button data-view="${it.k}" class="seg-opt ${state.view===it.k?'active':''}">${it.l}</button>`).join('');
}

let JOB = null;

function openJob(kind, ctx={}){
  if (JOB) return null;
  const def = JOB_DEFS[kind]; if (!def) return null;
  JOB = { kind, def, ctx, startedAt: Date.now(), done:false, ok:true, timer:null, endMsg:'',
          abort: new AbortController(), cancelled:false, notes:[], phaseIdx:null, pct:null, sub:'' };
  document.body.insertAdjacentHTML('beforeend',
    `<div class="job-overlay" id="jobOverlay" role="dialog" aria-modal="true" aria-label="${esc(def.title)}"></div>`);
  renderJob();
  JOB.timer = setInterval(renderJob, 1000);
  return JOB.abort.signal;
}
function cancelJob(){
  if (!JOB || JOB.done) return;
  JOB.cancelled = true;
  if (JOB.abort) JOB.abort.abort();
  const msg = JOB.kind === 'ingest' ? '已取消解析' : '已取消生成';
  finishJob(false, msg);
  toast(msg,'warn');
}
function jobPhase(i, detail){
  if (!JOB || JOB.done) return;
  JOB.phaseIdx = i;
  if (detail !== undefined) JOB.sub = detail;
  renderJob();
}
function jobPct(p){
  if (!JOB || JOB.done) return;
  JOB.pct = Math.max(0, Math.min(99, p));
  renderJob();
}
function jobNote(text){
  if (!JOB || JOB.done) return;
  const at = Math.max(0, (Date.now() - JOB.startedAt) / 1000);
  JOB.notes.push([at, text]);
  renderJob();
}
function finishJob(ok, msg){
  if (!JOB) return;
  if (JOB.timer) clearInterval(JOB.timer);
  JOB.timer = null;
  JOB.done = true; JOB.ok = !!ok;
  JOB.endMsg = msg || (ok ? '生成完成' : '生成失败');
  renderJob();
  setTimeout(()=>{
    const el = document.getElementById('jobOverlay');
    if (el) el.remove();
    JOB = null;
  }, ok ? 950 : 1900);
}
function jobClock(sec){
  const d = new Date(JOB.startedAt + sec*1000);
  const p = n => String(n).padStart(2,'0');
  return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function renderJob(){
  const root = document.getElementById('jobOverlay');
  if (!root || !JOB) return;
  const { def, ctx } = JOB;
  const elapsed = Math.max(0, (Date.now() - JOB.startedAt) / 1000);
  const phases = def.phases;
  let active = phases.length - 1;
  if (typeof JOB.phaseIdx === 'number'){
    active = Math.max(0, Math.min(phases.length - 1, JOB.phaseIdx));
  } else {
    for (let i=0; i<phases.length; i++){
      if (elapsed < phases[i].at){ active = i - 1; break; }
    }
  }
  const allDone = JOB.done && JOB.ok;
  const lastAt = phases[phases.length-1].at;
  const pct = allDone ? 100 : (JOB.pct != null ? JOB.pct : Math.min(94, Math.round(elapsed / (lastAt + 5) * 100)));

  // 结构只创建一次，后续仅做增量更新，避免整块重绘造成闪跳
  let panel = root.querySelector('.job-panel');
  if (!panel){
    root.innerHTML = `
      <div class="job-backdrop"></div>
      <div class="job-panel card" aria-live="polite">
        <div class="job-head">
          <div>
            <div class="job-title"><span class="job-pip"></span><span class="job-title-text"></span></div>
            <div class="job-sub"></div>
          </div>
          <div class="job-elapsed"></div>
        </div>
        <div class="job-bar"><i style="width:0%"></i></div>
        <div class="job-phases">
          ${phases.map(p=>`<div class="job-phase">
            <span class="jp-ic"></span>
            <div>
              <div class="jp-name"><span>${esc(p.name)}</span><span class="jp-live"> …</span></div>
              <div class="jp-detail">${esc(p.detail)}</div>
            </div>
          </div>`).join('')}
        </div>
        <div class="job-console"></div>
        <div class="job-foot">
          <span class="job-foot-text"></span>
          <button type="button" class="btn job-cancel">${esc(def.cancelText || '取消生成')}</button>
        </div>
      </div>`;
    panel = root.querySelector('.job-panel');
    panel.querySelector('.job-cancel').addEventListener('click', cancelJob);
    JOB.logIdx = 0; JOB.endShown = false; JOB.scrolled = false;
  }

  panel.querySelector('.job-title-text').textContent = JOB.done
    ? (JOB.ok ? (def.doneTitle || '生成完成') : (def.failTitle || '生成未完成'))
    : (JOB.title || def.title);
  panel.querySelector('.job-pip').className = 'job-pip' + (JOB.done ? (JOB.ok ? ' done' : ' err') : '');
  panel.querySelector('.job-sub').textContent = JOB.done
    ? JOB.endMsg
    : (JOB.sub || (active >= 0 ? `${phases[active].name} · ${phases[active].detail}` : '正在准备…'));
  panel.querySelector('.job-elapsed').textContent = `${pct}% · ${Math.floor(elapsed)}s`;
  panel.querySelector('.job-bar i').style.width = pct + '%';

  panel.querySelectorAll('.job-phase').forEach((el, i)=>{
    const st = allDone ? 'done' : (i < active ? 'done' : (i === active ? 'active' : ''));
    el.className = 'job-phase' + (st ? ' ' + st : '');
    el.querySelector('.jp-ic').textContent = st === 'done' ? '✓' : (st === 'active' ? '●' : '');
  });

  // 日志：只追加新行，不重建节点
  const box = panel.querySelector('.job-console');
  const lines = (def.logs ? def.logs(ctx) : []).concat(JOB.notes || []).sort((a,b)=>a[0]-b[0])
    .filter(l => elapsed >= l[0]);
  let appended = false;
  while (JOB.logIdx < lines.length){
    const l = lines[JOB.logIdx++];
    box.insertAdjacentHTML('beforeend',
      `<div class="jc-line"><span class="jc-t">${jobClock(l[0])}</span><span>${esc(l[1])}</span></div>`);
    appended = true;
  }
  // 超时兜底提示：复用同一行，避免反复追加
  let stall = box.querySelector('.jc-stall');
  if (!JOB.done && elapsed > lastAt + 6){
    if (!stall){
      stall = document.createElement('div');
      stall.className = 'jc-line jc-stall';
      stall.innerHTML = '<span class="jc-t"></span><span class="jc-stall-t"></span>';
      box.appendChild(stall);
      appended = true;
    }
    stall.querySelector('.jc-t').textContent = jobClock(elapsed);
    stall.querySelector('.jc-stall-t').textContent = `助手仍在处理，已用时 ${Math.round(elapsed)} 秒，请稍候…`;
  } else if (stall){
    stall.remove();
  }
  if (JOB.done && !JOB.endShown){
    JOB.endShown = true;
    box.insertAdjacentHTML('beforeend',
      `<div class="jc-line"><span class="jc-t">${jobClock(elapsed)}</span><span class="${JOB.ok ? 'jc-ok' : 'jc-err'}">${esc(JOB.endMsg)}</span></div>`);
    appended = true;
  }
  panel.querySelector('.job-foot-text').textContent = JOB.done
    ? '已完成，正在更新页面…'
    : (def.footText || '生成期间请保持页面打开，可随时取消');
  panel.querySelector('.job-cancel').style.display = JOB.done ? 'none' : '';

  if (appended || !JOB.scrolled){
    box.scrollTop = box.scrollHeight;
    JOB.scrolled = true;
  }
}

}

/* =========================================================
   交互：事件委托
========================================================= */
document.addEventListener('click', e=>{
  const btn = e.target.closest('[data-act],[data-view],[data-tab],[data-learner-opt]');
  if (!btn) return;
  if (btn.dataset.view){ state.view = btn.dataset.view; render(); return; }
  if (btn.dataset.tab){ state.activeTab = btn.dataset.tab; render(); return; }
  if (btn.dataset.learnerOpt){ toggleLearnerOpt(btn.dataset.learnerOpt); return; }
  const act = btn.dataset.act;
  if (act==='open-history'){ openHistory(btn.dataset.kind); return; }
  if (act==='close-history'){ closeHistory(); return; }
  if (act==='restore-history'){ restoreHistory(btn.dataset.id); return; }
  if (act==='del-history'){ deleteHistory(btn.dataset.id); return; }
  if (act==='toggle-parse'){
    const id = btn.dataset.id;
    if (!id) return;
    const willOpen = !state.library.openIds[id];
    if (willOpen) state.library.openIds[id] = true;
    else delete state.library.openIds[id];
    const panel = document.querySelector(`[data-lib-detail="${id}"]`);
    if (panel) panel.classList.toggle('open', willOpen);
    btn.setAttribute('aria-expanded', String(willOpen));
    btn.textContent = willOpen ? '收起解析 ↑' : '展开解析 ↓';
    return;
  }
  if (act==='reset'){ doReset(); return; }
  if (act==='generate'){ startGenerate(); return; }
  if (act==='set-type'){ setLessonType(btn.dataset.v); return; }
  if (act==='goto-library'){
    state.view = 'library';
    render(); refreshLibrary();
    toast('已跳转资料库：上传解析后可返回继续备课','ok');
    return;
  }
  if (act==='regen'){ regenSection(btn.dataset.kind); return; }
  if (act==='export'){ exportPackage(btn.dataset.kind); return; }
  if (act==='add-row'){ addRow(btn.dataset.list, btn.dataset.tmpl); return; }
  if (act==='del-row'){ delRow(btn.dataset.list, +btn.dataset.i); return; }
  if (act==='add-item'){ addItem(btn.dataset.path); return; }
  if (act==='del-item'){ delItem(btn.dataset.path, +btn.dataset.i); return; }
  if (act==='assemble'){ runAssemble(); return; }
  if (act==='replace'){ replaceQ(btn.dataset.qid); return; }
  if (act==='export-paper'){ exportPaper(); return; }
  if (act==='upload'){ uploadMaterial(); return; }
  if (act==='del-mat'){ deleteMaterial(btn.dataset.id); return; }
  if (act==='gen-extra'){ genExtra(btn.dataset.kind); return; }
  // —— 备课配置 ——
  if (act==='edit-config'){
    state.prepEditing = true;
    render();
    window.scrollTo({top:0, behavior:'smooth'});
    return;
  }
});

// 高频输入事件（每敲一个键就触发）
document.addEventListener('input', e=>{
  const t = e.target;
  if (t.matches('[data-input]')){
    state.cfg[t.dataset.input]=t.value;
    // subject / lesson_type 是 <select>，不触发 input 事件，这里只处理 text input
    if (t.dataset.input==='learner_note') syncLearner();
    patchPrepState();
  }
  else if (t.matches('[data-period]')){
    state.cfg.lesson_period[t.dataset.period]=Math.max(1,+t.value||1);
    patchPrepState();
  }
  else if (t.matches('[data-input2]')){ state.paper.constraints[t.dataset.input2]=t.value; }
  else if (t.matches('[data-qt]')){ state.paper.constraints.question_types[t.dataset.qt]=Math.max(0,+t.value||0); render(); }
  else if (t.matches('[data-wing]')){ state.paper.constraints.four_wings_ratio[t.dataset.wing]=+t.value; render(); }
});

// change 事件只处理 checkbox / select 等结构性变化
document.addEventListener('change', e=>{
  const t = e.target;
  if (t.matches('[data-input]')){
    state.cfg[t.dataset.input]=t.value;
    if (t.dataset.input==='subject'){
      // 学科变化会影响生成上下文，属于结构级变化 → full render
      render();
      return;
    }
    if (t.dataset.input==='lesson_type' && (t.value==='其他' || state.cfg.lesson_type==='其他')){ render(); return; }

  else if (t.matches('[data-qt]')){ state.paper.constraints.question_types[t.dataset.qt]=Math.max(0,+t.value||0); render(); }
  else if (t.matches('[data-wing]')){ state.paper.constraints.four_wings_ratio[t.dataset.wing]=+t.value; render(); }
});

/* ---------- 备课生成 ---------- */
function setLessonType(key){
  if (!state.backend && key !== '新课'){
    toast('离线演示样例仅含「新课」，启动后端可体验全部课型','warn');
    return;
  }
  const prev = state.cfg.lesson_type;
  state.cfg.lesson_type = key;
  // 预填主题（只改 input.value 不触发 re-render）
  const presets = {'新课':'三角形内角和定理','复习课':'牛顿运动定律专题复习','习题课':'一次函数错题讲评','答疑课':'二次函数疑点解答','班会课':'手机管理的班级共识','心理课':'青春期情绪管理','其他':'校园垃圾分类现状调查'};
  const topicInput = document.querySelector('[data-input="topic"]');
  if (topicInput){
    if (!topicInput.value.trim() || Object.values(presets).includes(topicInput.value)){
      topicInput.value = presets[key]||'';
      state.cfg.topic = topicInput.value; // 同步 state
    }
  }
  // 如果是「其他」课型切换——DOM 结构会变（要显示 custom textarea），必须 full render
  const needCustomBlock = (prev==='其他' || key==='其他');
  if (needCustomBlock){ render(); return; }
  // 只 patch class：type-card.is-active
  document.querySelectorAll('.type-card').forEach(card=>{
    card.classList.toggle('is-active', card.dataset.v===key);
  });
  patchPrepState();
}

function toggleLearnerOpt(key){
  const arr = state.cfg.learner_opts;
  const i = arr.indexOf(key);
  if (i >= 0) arr.splice(i, 1); else arr.push(key);
  syncLearner();
  // patch chip .on
  document.querySelectorAll('.opt-chip[data-learner-opt]').forEach(chip=>{
    const k = chip.dataset.learnerOpt;
    chip.classList.toggle('on', arr.includes(k));
  });
  patchPrepState();
}

/* ---------- 备课分步向导 ---------- */

// 局部状态刷新：不动骨架 DOM，只更新 class / disabled / 进度条 / 按钮
// 高频操作（setLessonType / toggleLearnerOpt / data-input）走这个避免全量 render 引起的闪跳
function patchPrepState(){
  if (state.view !== 'prep' || !state.prepEditing) { renderTop(); return; }
  const c = state.cfg;
  const topicOk = c.topic.trim().length>=2 && c.topic.trim().length<=60;

  // 字数统计 span 局部刷新（不触发 full render）
  const countSpan = document.querySelector('[data-topic-count]');
  if (countSpan){
    countSpan.textContent = `${c.topic.trim().length}/60`;
    countSpan.classList.toggle('text-muted', topicOk);
    countSpan.classList.toggle('text-danger', !topicOk);
  }

  // topic input 的红色边框 class 同步
  const topicInput = document.querySelector('[data-topic-input]');
  if (topicInput){
    topicInput.classList.toggle('ring-1', !topicOk);
    topicInput.classList.toggle('ring-danger/40', !topicOk);
  }

  const configOk = !!c.lesson_type && topicOk && !!c.subject;

  // 生成按钮 disabled 状态（必填项完整才可生成）
  const generateBtn = document.querySelector('[data-act="generate"]');
  if (generateBtn){
    generateBtn.disabled = !configOk;
  }

  // 3) Lucide 图标初始化（patch 后依然要装 SVG）
  if (typeof window.__installLucideIcons === 'function'){
    try { window.__installLucideIcons(); } catch(e){}
  }

  renderTop();
}

// 结构级变化（切 view、展开/收起结构块）——必须 full render
function fullRender(){ render(); }

async function startGenerate(){
  const c = state.cfg;
  syncLearner();
  const topic = c.topic.trim();
  if (topic.length<2 || topic.length>60){ toast('主题需 2–60 字','err'); return; }
  if (JOB) return;
  state.package = null; state.ragHits = []; state.generating = true;

  const payload = {
    lesson_type:c.lesson_type, custom_type_name:c.custom_type_name,
    lesson_period:c.lesson_period, stage:c.stage, subject:c.subject, topic,
    learner:c.learner, special_requirements:c.special, outputs:BASE_OUTPUTS,
  };

  // 与组卷共用同一套过程浮层
  const signal = openJob('prep', { topic, subject:c.subject, stage:c.stage });
  let fallback = false;

  if (state.backend){
    try{
      const r = await fetch('/api/generate', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload), signal});
      const b = await r.json();
      if (b.ok && b.package){
        state.package = b.package; state.ragHits = b.rag_hits||[];
        state.activeTab = 'schedule'; state.prepEditing = false;
        state.historyId = null;  // 新生成，不关联旧历史
        fallback = b.source === 'preset_fallback';
      } else {
        state.package = fallbackSample(); state.activeTab='schedule'; state.prepEditing=false; fallback = true;
      }
    }catch(err){
      state.generating = false;
      if (err && err.name === 'AbortError') return;
      state.package = fallbackSample(); state.activeTab='schedule'; state.prepEditing=false; fallback = true;
    }
  } else {

function showExportMenu(kind, onDocx, onMd){
  document.querySelectorAll('[data-export-menu]').forEach(n=>n.remove());
  const curBtn = document.querySelector('button[data-act="export"][data-kind="'+kind+'"]');
  const menu = document.createElement('div');
  menu.setAttribute('data-export-menu','1');
  // 先渲染，再算尺寸定位
  menu.innerHTML = `<div style="padding:4px 0;">
    <div data-fmt="docx" style="padding:10px 14px; cursor:pointer;">
      <div>导出 Word 文档（.docx）</div>
      <div style="font-size:11px;color:#999;">保留表格与格式</div>
    </div>
    <div data-fmt="md" style="padding:10px 14px; cursor:pointer;">
      <div>导出 Markdown（.md）</div>
      <div style="font-size:11px;color:#999;">便于二次编辑</div>
    </div>
  </div>`;
  menu.style.cssText = `position:fixed; z-index:9999; min-width:200px; background:#fff; border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.18); border:1px solid #EEE;`;
  document.body.appendChild(menu);

  // 定位：默认按钮下方；如果下方空间不足则向上弹；同时限制不超出视口边界
  let left = curBtn ? curBtn.getBoundingClientRect().left : window.innerWidth/2 - 100;
  let top = curBtn ? curBtn.getBoundingClientRect().bottom + 6 : window.innerHeight/2 - menu.offsetHeight/2;
  let placeAbove = false;
  if (curBtn && top + menu.offsetHeight > window.innerHeight - 8){
    placeAbove = true;
    top = curBtn.getBoundingClientRect().top - menu.offsetHeight - 6;
  }
  // 水平边界
  if (left + menu.offsetWidth > window.innerWidth - 8) left = window.innerWidth - menu.offsetWidth - 8;
  if (left < 8) left = 8;
  // 垂直边界（向上弹也别超出顶部）
  if (top < 8) top = 8;

  menu.style.left = left + 'px';
  menu.style.top = top + 'px';

  menu.querySelectorAll('[data-fmt]').forEach(row=>{
    row.onmouseenter = ()=>{ row.style.background='#F3F2EE'; };
    row.onmouseleave = ()=>{ row.style.background='transparent'; };
    row.onclick = (e)=>{
      e.stopPropagation(); menu.remove();
      if (row.dataset.fmt==='docx') onDocx(); else onMd();
    };
  });
  setTimeout(()=>{
    const closer = (e)=>{
      if (!menu.contains(e.target)){ menu.remove(); document.removeEventListener('click', closer, true); }
    };
    document.addEventListener('click', closer, true);
  }, 0);
}

async function _downloadViaApi(url, body, onDone){
  try{
    const r = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
    if (!r.ok){ toast('导出失败：'+r.status,'err'); return; }
    const blob = await r.blob();
    const cd = r.headers.get('Content-Disposition') || '';
    let filename = '';
    // 优先 RFC 5987 编码：filename*=UTF-8''%E4%B8%89...
    const mStar = cd.match(/filename\*=UTF-8''([^;]+)/i);
    if (mStar) filename = decodeURIComponent(mStar[1].trim());
    else {
      // 回退到普通 filename="xxx"
      const mPlain = cd.match(/filename="?([^";]+)"?/i);
      if (mPlain) filename = mPlain[1].trim();
    }
    if (!filename) filename = url.endsWith('pptx') ? '导出.pptx' : '导出.docx';
    filename = filename.replace(/^"|"$/g,'');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
    if (onDone) onDone(filename);
  }catch(e){ toast('导出失败：'+e.message,'err'); }
}
function sanitize(s){ return String(s).replace(/[\\/:*?"<>|\s]+/g,'_').slice(0,40)||'备课'; }

function recomputePaper(r){
  // 换题后按当前试卷行重算统计与双向细目表，保证顶部统计/细目表与展示一致。
  const DIFF=['基础','提升','拓展'], WINGS=['基础性','综合性','应用性','创新性'];
  const paper=r.paper||[];
  const stats={
    count:paper.length,
    total_score:paper.reduce((a,q)=>a+(+q.score||0),0),
    difficulty_dist:{}, four_wings_dist:{},
    kp_coverage:[...new Set(paper.flatMap(q=>q.kps||[]))].sort(),
  };
  DIFF.forEach(d=>stats.difficulty_dist[d]=paper.filter(q=>q.difficulty===d).length);
  WINGS.forEach(w=>stats.four_wings_dist[w]=paper.filter(q=>(q.wings||[]).includes(w)).length);
  const kps=[...new Set(paper.flatMap(q=>q.kps||[]))].sort();
  const types=[...new Set(paper.map(q=>q.type))];
  const matrix=[];
  kps.forEach(kp=>{
    const row={kp};
    types.forEach(t=>{
      const cells=paper.filter(q=>(q.kps||[]).includes(kp)&&q.type===t);
      row[t]={count:cells.length,score:cells.reduce((a,c)=>a+(+c.score||0),0),nos:cells.map(c=>c.no)};
    });
    row.total=types.reduce((a,t)=>a+row[t].score,0);
    matrix.push(row);
  });
  const totalRow={kp:'合计'};
  types.forEach(t=>{
    const cells=paper.filter(q=>q.type===t);
    totalRow[t]={count:cells.length,score:cells.reduce((a,c)=>a+(+c.score||0),0),nos:[]};
  });
  totalRow.total=types.reduce((a,t)=>a+totalRow[t].score,0);
  matrix.push(totalRow);
  r.stats=stats; r.blueprint={types,matrix};
}
async function replaceQ(qid){
  if (!state.backend){ toast('演示模式不支持换题','warn'); return; }
  if (!state.paper.result){ return; }
  try{
    const c = state.paper.constraints;
    const constraints = {
      subject:c.subject,
      knowledge_points: c.knowledge_points.split(/[,，]/).map(s=>s.trim()).filter(Boolean),
      question_types: c.question_types,
      difficulty_ratio: c.difficulty_ratio,
      four_wings_ratio: c.four_wings_ratio,
      total_score: +c.total_score||100,
      sources: c.sources,
    };
    const current = (state.paper.result.paper||[]).find(q=>q.qid===qid);
    const exclude_qids = (state.paper.result.paper||[]).map(q=>q.qid).filter(Boolean);
    const r = await fetch('/api/paper/replace',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({qid, constraints, exclude_qids,
        current_question: current ? {type:current.type, difficulty:current.difficulty, kps:current.kps||[]} : null})});
    const b = await r.json();
    if (b.ok && b.question){
      const old = state.paper.result.paper.find(q=>q.qid===qid);
      if (old){
        Object.assign(old, {qid:b.question.qid, type:b.question.type, difficulty:b.question.difficulty, stem:b.question.stem, wings:b.question.wings||['基础性'], kps:b.question.kps||[], source:b.question.source||''});
        // 保留原分值，保证总分不变；同步更新答案
        const ak = (state.paper.result.answer_key||[]).find(a=>a.qid===qid);
        if (ak){ ak.qid = b.question.qid; ak.answer = b.question.answer||ak.answer; }
        recomputePaper(state.paper.result);
      }
      if (b.warnings && b.warnings.length){
        state.paper.result.warnings = [...new Set([...(state.paper.result.warnings||[]), ...b.warnings])];
      }
      const aiFill = (b.warnings||[]).some(w=>String(w).indexOf('AI')>=0);
      render(); toast(aiFill ? '已换题（题库不足，已用 AI 补题，请审核）' : '已换题，统计与细目表已刷新','ok');
    } else {
      toast('换题失败：'+(b.error||'没有可替换的题目'),'warn');
    }
  }catch(e){ toast('换题失败：'+e.message,'err'); }
}

    </div>
  </div>`;
}
async function restoreHistory(id){
  try{
    const r = await fetch('/api/history/'+encodeURIComponent(id));
    const b = await r.json();
    if (!b.ok || !b.item){ toast('历史记录读取失败','err'); return; }
    const rec = b.item;
    const p = rec.payload || {};
    if (rec.kind==='prep'){
      if (p.cfg) Object.assign(state.cfg, p.cfg);
      state.package = p.package || null;
      state.ragHits = p.rag_hits || [];
      state.historyId = id;
      state.activeTab = 'schedule'; state.prepEditing = false; state.view = 'prep';
    } else {
      const cs = p.constraints || {};
      if (cs && Object.keys(cs).length){
        Object.assign(state.paper.constraints, {
          subject: cs.subject || state.paper.constraints.subject,
          knowledge_points: Array.isArray(cs.knowledge_points) ? cs.knowledge_points.join(', ') : state.paper.constraints.knowledge_points,
          question_types: cs.question_types || state.paper.constraints.question_types,
          difficulty_ratio: cs.difficulty_ratio || state.paper.constraints.difficulty_ratio,
          four_wings_ratio: cs.four_wings_ratio || state.paper.constraints.four_wings_ratio,
          total_score: cs.total_score || state.paper.constraints.total_score,
          sources: cs.sources || state.paper.constraints.sources,
        });
      }
      state.paper.result = p.result || null; state.view = 'paper'; state.historyId = id;
    }
    closeHistory(); render();
    window.scrollTo({ top:0, behavior:'smooth' });
    toast('已恢复'+(rec.kind==='prep'?'历史备课':'历史组卷'),'ok');
  }catch(e){ toast('历史记录读取失败：'+e.message,'err'); }
}
async function deleteHistory(id){
  try{
    await fetch('/api/history/'+encodeURIComponent(id), {method:'DELETE'});
    state.history.items = state.history.items.filter(x=>x.id!==id);
    renderHistoryModal(); toast('已删除历史记录','ok');
  }catch(e){ toast('删除失败：'+e.message,'err'); }
}

async function uploadMaterial(){
  if (state.library.uploading) return;
  const files = Array.from(($('#upFile')?.files)||[]);
  const typedText = $('#upText').value.trim();
  if (!files.length && !typedText){ toast('请粘贴文本或选择文件','warn'); return; }
  const nameInput = ($('#upName')?.value||'').trim();
  const type = $('#upType').value;
  const parseQ = $('#upParse').checked || ['试卷','课后习题'].includes(type);
  const useFor = $('#upUse').checked;
  const BIN_EXTS = ['pdf','docx','doc','xls','xlsx','ppt','pptx','png','jpg','jpeg','gif'];
  // 多文件 → 逐个解析；单文件可自定义名称；无文件 → 粘贴文本
  const tasks = files.length
    ? files.map(f=>({file:f, name: files.length===1 ? (nameInput||f.name) : f.name}))
    : [{file:null, name:nameInput||'未命名', text:typedText}];

  const signal = openJob('ingest', {count: tasks.length});
  if (!signal){ toast('请等待当前任务完成','warn'); return; }
  if (tasks.length > 1 && JOB) JOB.title = `正在解析 ${tasks.length} 份资料`;

  state.library.uploading = true; render();
  let okCount=0, failCount=0, firstErr='';
  try{
    for (let i=0; i<tasks.length; i++){
      if (!JOB || JOB.cancelled) break;
      const t = tasks[i];
      const prefix = tasks.length>1 ? `[${i+1}/${tasks.length}] ` : '';
      jobPct(Math.round(i/tasks.length*100));
      jobPhase(0, `${prefix}${t.name}`);
      jobNote(`${prefix}开始处理 ${t.name}`);
      try{
        let b;
        const ext = t.file ? (t.file.name.split('.').pop()||'').toLowerCase() : '';
        const isBinary = !!t.file && BIN_EXTS.includes(ext);
        if (isBinary){
          jobPhase(1, '抽取文本，随后由智能体生成摘要');
          const phaseTimer = setTimeout(()=>jobPhase(2, '智能体正在生成摘要与要点'), 1200);
          const fd = new FormData();
          fd.append('file', t.file);
          fd.append('file_name', t.name);
          fd.append('file_type', type);
          fd.append('parse_questions', parseQ ? '1' : '0');
          fd.append('use_for', useFor ? '1' : '0');
          fd.append('ai_analyze', '1');
          try{
            const r = await fetch('/api/library/upload-file',{method:'POST',body:fd,signal});
            b = await r.json();
          }finally{ clearTimeout(phaseTimer); }
        } else {
          jobPhase(1, t.file ? '读取文本文件' : '整理粘贴文本');
          let finalText = t.text || '';
          if (!finalText && t.file) finalText = await t.file.text();
          if (!finalText) throw new Error('未能读取文件内容');
          jobPhase(2, '智能体正在生成摘要与要点');
          jobNote(`${prefix}抽取完成，提交智能体理解`);
          const r = await fetch('/api/library/upload',{method:'POST',headers:{'Content-Type':'application/json'},signal,
            body:JSON.stringify({file_name:t.name,file_type:type,text:finalText,parse_questions:parseQ,use_for:useFor,ai_analyze:true})});
          b = await r.json();
        }
        if (!b.ok) throw new Error(b.error || '上传失败');
        state.library.items.unshift(b.material);
        state.library.stats = b.stats || state.library.stats;
        okCount++;
        jobPhase(3, `已入库：${b.material.chunk_count||0} 个切片`);
        jobNote(`${prefix}完成：${b.material.chunk_count||0} 个切片${b.material.ai?' · 已生成摘要':''}`);
      }catch(err){
        if (err && err.name === 'AbortError') break;
        failCount++;
        firstErr = firstErr || (err.message || '未知错误');
        jobNote(`${prefix}失败：${err.message || '未知错误'}`);
      }
    }

    if (JOB && JOB.cancelled){
      // 取消流程已由 cancelJob 结束浮层
    } else if (failCount === 0){
      finishJob(true, tasks.length>1 ? `${okCount} 份资料解析完成` : '资料解析完成');
      toast(tasks.length>1 ? `已加入共享资料库：${okCount} 份` : '已加入共享资料库','ok');
    } else if (okCount === 0){
      finishJob(false, '解析失败：'+(firstErr||'未知错误'));
      toast('解析失败：'+(firstErr||'未知错误'),'err');
    } else {
      finishJob(true, `${okCount} 份成功 · ${failCount} 份失败`);
      toast(`${okCount} 份成功，${failCount} 份失败`,'warn');
    }
  }catch(e){
    if (!(e && e.name === 'AbortError')){
      finishJob(false, '解析失败：'+(e.message||'未知错误'));
      toast('解析失败：'+(e.message||'未知错误'),'err');
    }
  }finally{
    state.library.uploading = false;
    $('#upText').value=''; $('#upName').value=''; if ($('#upFile')) $('#upFile').value='';
    render();
  }
}
async function deleteMaterial(id){
  if (state.backend){ try{ await fetch('/api/library/'+id,{method:'DELETE'}); }catch(e){} }
  state.library.items = state.library.items.filter(m=>m.upload_id!==id);
  refreshLibrary();
  toast('已删除');
}

function doReset(){
  state.package=null; state.activeTab='schedule'; state.editedCount=0; state.ragHits=[];
  state.paper.result=null;
  render();
}
