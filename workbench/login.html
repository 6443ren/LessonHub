<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>智备 · 登录</title>
<meta name="theme-color" content="#0E4C42" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E4C42'/%3E%3Ctext x='32' y='45' font-size='36' text-anchor='middle' fill='%23F6F1E4' font-family='serif'%3E智%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* =========================================================
   智备登录 · 纸美学 + 编辑排版
   - 墨绿 forest #0E4C42  主色（品牌区、按钮、重点）
   - 明金  #D4AF37         点缀（logo、强调字、装饰）—— 比哑光金亮一倍，对比度足够
   - 米纸 paper #F4EFE3    背景
   - 朱砂 clay #C2492A     错误/警示
   ========================================================= */
:root{
  --paper:#F4EFE3; --paper-2:#FAF6EC; --card:#FFFDF7;
  --ink:#1A2A24; --ink-2:#42534B; --muted:#6E7E76; --faint:#95A199;
  --line:#E4DAC7; --line-2:#D6C9B0;
  --forest:#0E4C42; --forest-2:#14695B; --forest-soft:#E8F1EC;
  --clay:#C2492A; --clay-soft:#FBEBE3;
  --gold:#D4AF37; --gold-deep:#A88B2A; --gold-soft:#FBF3D8;
  --ok:#1C7A58; --ok-soft:#E7F4ED; --danger:#B23A2C; --danger-soft:#FBEAE6;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --shadow-sm:0 1px 2px rgba(26,42,36,.06), 0 1px 0 rgba(26,42,36,.03);
  --shadow-md:0 4px 12px rgba(26,42,36,.06), 0 24px 48px -24px rgba(26,42,36,.32);
  --shadow-lg:0 6px 16px rgba(26,42,36,.07), 0 40px 70px -36px rgba(26,42,36,.40);
  --serif:"Noto Serif SC","Songti SC","STSong","Source Han Serif SC","SimSun",serif;
  --sans:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono","SFMono-Regular","JetBrains Mono",Consolas,monospace;
}

*{box-sizing:border-box; -webkit-font-smoothing:antialiased;}
html, body{height:100%; margin:0; overflow:hidden;}
body{
  font-family:var(--sans); font-size:14.5px; line-height:1.65; color:var(--ink);
  background:
    radial-gradient(1100px 620px at 88% -12%, rgba(14,76,66,.10), transparent 62%),
    radial-gradient(900px 520px at -8% 8%, rgba(194,73,42,.06), transparent 60%),
    linear-gradient(180deg, #F7F2E7 0%, var(--paper) 42%, #F1EBDD 100%);
}

/* 细网格纹理 — 工作台同款砂纸感 */
.bg-grid{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:
    linear-gradient(rgba(14,76,66,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(14,76,66,.05) 1px, transparent 1px);
  background-size:34px 34px;
  -webkit-mask-image:linear-gradient(180deg, #000 0%, rgba(0,0,0,.55) 38%, transparent 78%);
          mask-image:linear-gradient(180deg, #000 0%, rgba(0,0,0,.55) 38%, transparent 78%);
}

/* ====== 两栏布局 ====== */
.page{
  position:relative; z-index:1;
  display:grid; grid-template-columns:1.05fr 1fr;
  height:100vh;
}

/* =========================================================
   左侧品牌区
   - 深绿底 + 明金点缀 + 细网格
   - 垂直接缝上金色装饰线，把两栏连起来
   ========================================================= */
.brand-side{
  position:relative; background:var(--forest); overflow:hidden;
  display:flex; flex-direction:column; justify-content:center;
  padding:4rem 3.5rem; color:white;
}
/* 接缝装饰线 — 贯穿全高的金色细线 + 圆点，连接左右两栏 */
.seam-line{
  position:absolute; right:0; top:0; bottom:0;
  width:2px; background:var(--gold); opacity:.55;
}
.seam-dot{
  position:absolute; right:-5px; top:50%; transform:translateY(-50%);
  width:12px; height:12px; border-radius:50%;
  background:var(--gold);
  box-shadow:0 0 0 4px rgba(212,175,55,.18), 0 0 0 10px rgba(212,175,55,.06);
}
/* 深绿内部的金色光晕（右上角） */
.brand-side::before{
  content:''; position:absolute;
  top:-180px; right:-180px;
  width:520px; height:520px; border-radius:50%;
  background:radial-gradient(circle, rgba(212,175,55,.18) 0%, rgba(212,175,55,0) 65%);
}
/* 细网格叠层（比纸区稍密） */
.brand-grid{
  position:absolute; inset:0; pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
  background-size:28px 28px;
}

.brand-content{position:relative; z-index:2; max-width:440px;}

/* ---- Logo ---- */
.brand-logo{
  display:inline-flex; align-items:center; gap:14px; margin-bottom:3.5rem;
  animation:fadeUp .8s ease both;
}
/* Logo 方块：明金底 + 深绿"智"字 — 传统印章感，对比度拉满 */
.brand-logo-mark{
  width:52px; height:52px; background:var(--gold);
  border-radius:12px;
  display:grid; place-items:center;
  font-family:var(--serif); font-weight:900; font-size:28px;
  color:var(--forest);
  box-shadow:0 2px 0 rgba(0,0,0,.12), 0 8px 24px rgba(212,175,55,.25);
  position:relative;
}
.brand-logo-mark::after{
  /* 内侧微光，增加质感 */
  content:''; position:absolute; inset:3px; border-radius:8px;
  border:1px solid rgba(14,76,66,.12);
}
.brand-logo-text{
  font-family:var(--serif); font-weight:600; font-size:22px; letter-spacing:3px; line-height:1.2;
}
.brand-logo-sub{
  font-family:var(--mono); font-size:10.5px; letter-spacing:4px;
  opacity:.55; margin-top:3px; text-transform:uppercase;
}

/* ---- Hero 标题 ---- */
.brand-hero{
  animation:fadeUp .9s ease .12s both;
}
.brand-hero .eyebrow{
  font-family:var(--mono); font-size:10.5px; letter-spacing:4px;
  opacity:.45; text-transform:uppercase; margin-bottom:1rem;
  display:flex; align-items:center; gap:10px;
}
.brand-hero .eyebrow::before{
  content:''; width:24px; height:1px; background:var(--gold); opacity:.7;
}
.brand-headline{
  font-family:var(--serif); font-weight:900;
  font-size:clamp(40px, 4.6vw, 64px);
  line-height:1.08; letter-spacing:-1px;
}
.brand-headline .gold{
  color:var(--gold);
  position:relative;
}
/* "章法"二字下金色细线装饰 */
.brand-headline .gold::after{
  content:''; position:absolute; left:0; right:0; bottom:-4px;
  height:3px; background:var(--gold); border-radius:2px; opacity:.6;
}
.brand-subline{
  margin-top:1.75rem; font-size:14.5px; line-height:1.85;
  opacity:.75; max-width:360px;
  animation:fadeUp .9s ease .25s both;
}

/* ---- 特性行 ---- */
.brand-features{
  margin-top:2.75rem; display:flex; flex-direction:column; gap:10px;
  animation:fadeUp .9s ease .4s both;
}
.feature-row{
  display:flex; align-items:center; gap:12px; font-size:13px; opacity:.8;
}
.feature-dot{width:6px; height:6px; border-radius:50%; background:var(--gold); flex-shrink:0;}
.feature-line{width:20px; height:1px; background:rgba(255,255,255,.18); flex-shrink:0;}

.brand-footer{
  position:absolute; bottom:2rem; left:3.5rem; z-index:2;
  font-family:var(--mono); font-size:10px; letter-spacing:3px;
  opacity:.35; text-transform:uppercase;
}

/* =========================================================
   右侧表单区
   - 纸色背景 + 表单卡片悬浮
   - 输入框有清晰的层级状态（默认/hover/focus/error）
   - 登录按钮有主色 + 微渐变
   ========================================================= */
.form-side{
  position:relative;
  display:flex; flex-direction:column; justify-content:center;
  padding:2rem clamp(1.5rem, 5vw, 5rem);
  animation:fadeLeft .7s ease .18s both;
}
.form-wrap{
  max-width:420px; width:100%; margin:0 auto;
}

/* 表单标题 */
.form-kicker{
  font-family:var(--mono); font-size:11px; font-weight:500;
  letter-spacing:3px; text-transform:uppercase;
  color:var(--gold-deep); margin-bottom:12px;
  display:flex; align-items:center; gap:10px;
}
.form-kicker::before{
  content:''; width:28px; height:2px; background:var(--gold); border-radius:1px;
}
.form-title{
  font-family:var(--serif); font-weight:700;
  font-size:34px; color:var(--forest);
  line-height:1.2; margin-bottom:8px;
}
.form-subtitle{color:var(--muted); font-size:14px; margin-bottom:2.25rem;}

/* 输入框 */
.field{margin-bottom:1.1rem;}
.field-label{
  display:block; font-family:var(--mono);
  font-size:11px; font-weight:600; color:var(--ink-2);
  letter-spacing:2px; margin-bottom:7px; text-transform:uppercase;
}
.field-input{
  width:100%; padding:13px 16px; font-size:15px;
  font-family:var(--sans);
  border:1.5px solid var(--line); border-radius:var(--r-md);
  background:var(--card); color:var(--ink);
  transition:border-color .22s, box-shadow .22s, background .22s, transform .15s;
  outline:none;
}
.field-input::placeholder{color:var(--faint);}
.field-input:hover{
  border-color:var(--line-2);
  background:white;
}
.field-input:focus{
  border-color:var(--forest);
  background:white;
  box-shadow:0 0 0 4px rgba(14,76,66,.10);
}
.field-input.err{border-color:var(--clay); box-shadow:0 0 0 4px rgba(194,73,42,.12);}
.field-pass{position:relative;}
.toggle-pass{
  position:absolute; right:12px; top:50%; transform:translateY(-50%);
  background:none; border:none; color:var(--muted); cursor:pointer;
  font-size:12px; padding:6px 8px; font-family:var(--mono);
  letter-spacing:1px; border-radius:6px;
  transition:color .15s, background .15s;
}
.toggle-pass:hover{color:var(--forest); background:var(--gold-soft);}

/* 错误提示 */
.form-error{
  display:none; margin-bottom:1.1rem; padding:12px 14px;
  background:var(--danger-soft); border-left:3px solid var(--danger);
  border-radius:var(--r-sm); font-size:13px; color:var(--danger);
}
.form-error.show{display:block; animation:shake .4s ease;}

/* 登录按钮 — 微渐变 + 悬浮阴影 */
.login-btn{
  width:100%; height:48px; margin-top:.75rem;
  background:linear-gradient(180deg, var(--forest-2) 0%, var(--forest) 100%);
  color:white; border:none;
  border-radius:var(--r-md); font-size:15px; font-weight:600;
  font-family:var(--sans); letter-spacing:4px;
  cursor:pointer; position:relative; overflow:hidden;
  box-shadow:0 2px 0 rgba(14,76,66,.15), 0 10px 24px -8px rgba(14,76,66,.45);
  transition:transform .15s, box-shadow .22s, filter .15s;
}
.login-btn:hover:not(:disabled){
  filter:brightness(1.06);
  box-shadow:0 2px 0 rgba(14,76,66,.15), 0 14px 28px -8px rgba(14,76,66,.55);
  transform:translateY(-1px);
}
.login-btn:active:not(:disabled){transform:translateY(0); box-shadow:0 1px 0 rgba(14,76,66,.15), 0 4px 12px -4px rgba(14,76,66,.4);}
.login-btn:disabled{opacity:.65; cursor:not-allowed; filter:saturate(.5);}
.login-btn .spinner{
  display:none; width:18px; height:18px;
  border:2px solid rgba(255,255,255,.25); border-top-color:white;
  border-radius:50%; animation:spin .7s linear infinite;
  margin-right:10px; vertical-align:middle;
}
.login-btn.loading .spinner{display:inline-block;}

/* 分割线 */
.divider{
  display:flex; align-items:center; gap:14px;
  margin:2.25rem 0 1.1rem;
  color:var(--muted); font-family:var(--mono);
  font-size:10.5px; letter-spacing:3px; text-transform:uppercase;
}
.divider::before, .divider::after{
  content:''; flex:1; height:1px; background:var(--line);
}

/* 测试账号卡片 — 更紧凑，头像更大更有存在感 */
.accounts{display:grid; gap:8px;}
.account-card{
  display:flex; align-items:center; gap:12px;
  padding:11px 14px;
  border:1px solid var(--line); border-radius:var(--r-md);
  cursor:pointer; transition:all .2s cubic-bezier(.2,.8,.2,1);
  background:var(--card); position:relative; overflow:hidden;
}
.account-card::before{
  /* hover 时金色流光从左扫到右 */
  content:''; position:absolute; left:0; top:0; bottom:0; width:3px;
  background:var(--gold); transform:scaleY(0);
  transition:transform .25s; transform-origin:center;
}
.account-card:hover{
  border-color:var(--gold); background:var(--gold-soft);
  transform:translateY(-1px);
  box-shadow:var(--shadow-sm);
}
.account-card:hover::before{transform:scaleY(1);}
.avatar{
  width:36px; height:36px; border-radius:50%;
  background:var(--forest); color:white;
  display:grid; place-items:center;
  font-family:var(--serif); font-weight:700; font-size:15px;
  flex-shrink:0; letter-spacing:0;
  transition:transform .2s;
}
.account-card:hover .avatar{transform:scale(1.05);}
.avatar.gold{background:var(--gold); color:var(--forest); box-shadow:0 2px 8px rgba(212,175,55,.3);}
.acct-info{flex:1; min-width:0;}
.acct-name{font-family:var(--serif); font-size:15px; font-weight:600; color:var(--ink);}
.acct-id{font-family:var(--mono); font-size:11px; color:var(--faint); letter-spacing:.5px; margin-top:2px;}

/* ====== 响应式 ====== */
@media (max-width:900px){
  .page{grid-template-columns:1fr; grid-template-rows:auto 1fr; height:auto; min-height:100vh;}
  body{overflow:auto;}
  .brand-side{min-height:340px; padding:2.5rem 2rem;}
  .brand-headline{font-size:32px;}
  .brand-features, .brand-footer{display:none;}
  .seam-line{right:auto; top:auto; left:0; bottom:0; width:100%; height:2px;}
  .seam-dot{top:auto; bottom:-5px; left:50%; right:auto; transform:translateX(-50%);}
  .form-side{padding:2.5rem 1.5rem 3.5rem;}
}
@media (max-width:480px){
  .brand-logo-mark{width:44px; height:44px; font-size:22px; border-radius:10px;}
  .brand-headline{font-size:28px;}
  .form-title{font-size:28px;}
}

/* ====== 动画 ====== */
@keyframes fadeUp{from{opacity:0; transform:translateY(18px);} to{opacity:1; transform:translateY(0);}}
@keyframes fadeLeft{from{opacity:0; transform:translateX(24px);} to{opacity:1; transform:translateX(0);}}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes shake{0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);}}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important; transition:none !important;}
}
</style>
</head>
<body>
<div class="bg-grid" aria-hidden="true"></div>

<div class="page">

  <!-- 左侧品牌区 -->
  <div class="brand-side">
    <div class="brand-grid"></div>
    <div class="seam-line"></div>
    <div class="seam-dot"></div>

    <div class="brand-content">
      <div class="brand-logo">
        <div class="brand-logo-mark">智</div>
        <div>
          <div class="brand-logo-text">智备工作台</div>
          <div class="brand-logo-sub">ZHI BEI · WORKBENCH</div>
        </div>
      </div>

      <div class="brand-hero">
        <div class="eyebrow">TEACHER'S LESSON</div>
        <h1 class="brand-headline">让备课<br>更有<span class="gold">章法</span></h1>
      </div>
      <p class="brand-subline">
        教师智能备课工作台 — 一站式生成教案、PPT、作业与试卷，让每一节课都有清晰的设计与扎实的素材支撑。
      </p>

      <div class="brand-features">
        <div class="feature-row"><span class="feature-dot"></span><span class="feature-line"></span><span>AI 智能备课 · RAG 知识库检索</span></div>
        <div class="feature-row"><span class="feature-dot"></span><span class="feature-line"></span><span>自动生成 PPT · 教案 · 作业</span></div>
        <div class="feature-row"><span class="feature-dot"></span><span class="feature-line"></span><span>双向细目表组卷 · 学情分析</span></div>
      </div>
    </div>

    <div class="brand-footer">Teacher's Intelligent Workbench</div>
  </div>

  <!-- 右侧表单区 -->
  <div class="form-side">
    <div class="form-wrap">
      <div class="form-kicker">SIGN IN</div>
      <h2 class="form-title">欢迎回来</h2>
      <p class="form-subtitle">请登录以访问您的备课工作台</p>

      <div id="errBox" class="form-error"></div>

      <form id="loginForm" autocomplete="off" novalidate>
        <div class="field">
          <label class="field-label" for="username">账号</label>
          <input id="username" class="field-input" type="text" name="username" placeholder="请输入账号" required autofocus />
        </div>

        <div class="field">
          <label class="field-label" for="password">密码</label>
          <div class="field-pass">
            <input id="password" class="field-input" type="password" name="password" placeholder="请输入密码" required />
            <button type="button" class="toggle-pass" id="togglePass">显示</button>
          </div>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">
          <span class="spinner"></span>
          <span class="btn-text">登 录</span>
        </button>
      </form>

      <div class="divider">测试账号 · 一键登录</div>
      <div id="accounts" class="accounts"></div>
    </div>
  </div>

</div>

<script>
const $ = s => document.querySelector(s);

(async function init() {
  try {
    const me = await api('/api/me');
    if (me.ok) { location.href = '/index.html'; return; }
  } catch {}
  try {
    const r = await fetch('/api/test-accounts');
    const j = await r.json();
    if (j.ok) renderAccounts(j.accounts);
  } catch {}
})();

function renderAccounts(list) {
  const host = $('#accounts');
  host.innerHTML = list.map(a => {
    const initial = a.name.charAt(0);
    const isFull = a.id === 'teacher01';
    return `
      <div class="account-card" data-u="${a.id}" data-p="${a.id}">
        <div class="avatar ${isFull ? 'gold' : ''}">${initial}</div>
        <div class="acct-info">
          <div class="acct-name">${a.name}</div>
          <div class="acct-id">账号：${a.id} · 密码：${a.id}</div>
        </div>
      </div>
    `;
  }).join('');
  host.querySelectorAll('.account-card').forEach(el => {
    el.addEventListener('click', () => quickLogin(el.dataset.u, el.dataset.p));
  });
}

const form = $('#loginForm');
const btn = $('#loginBtn');
const errBox = $('#errBox');
const usernameEl = $('#username');
const passwordEl = $('#password');
const togglePass = $('#togglePass');

togglePass.addEventListener('click', () => {
  const el = passwordEl;
  if (el.type === 'password') { el.type = 'text'; togglePass.textContent = '隐藏'; }
  else { el.type = 'password'; togglePass.textContent = '显示'; }
});

function showError(msg) {
  errBox.textContent = msg || '登录失败，请重试';
  errBox.classList.add('show');
  passwordEl.classList.add('err');
  passwordEl.select();
  setTimeout(() => passwordEl.classList.remove('err'), 800);
}
function clearError() { errBox.classList.remove('show'); errBox.textContent = ''; }

form.addEventListener('submit', async e => {
  e.preventDefault(); clearError();
  const u = usernameEl.value.trim();
  const p = passwordEl.value;
  if (!u || !p) { showError('账号和密码都不能为空'); return; }
  await doLogin(u, p);
});

async function quickLogin(u, p) {
  usernameEl.value = u; passwordEl.value = p; clearError();
  await doLogin(u, p);
}

async function doLogin(u, p) {
  btn.classList.add('loading'); btn.disabled = true;
  try {
    const resp = await fetch('/api/login', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:u, password:p}),
      credentials:'same-origin',
    });
    const j = await resp.json();
    if (resp.ok && j.ok) {
      btn.querySelector('.btn-text').textContent = '登录成功，跳转中…';
      setTimeout(() => { location.href = '/index.html'; }, 400);
      return;
    }
    showError(j.error || '登录失败');
  } catch (err) {
    showError('网络错误，请检查后端服务');
  } finally {
    btn.classList.remove('loading'); btn.disabled = false;
  }
}

async function api(url) {
  const r = await fetch(url, {credentials:'same-origin'});
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
</script>
</body>
</html>
